# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - tailorsync-api-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments to avoid Azure 409 Conflict locks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate and collect dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
                
      # Upload only the backend folder as the deployment artifact
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: backend/
          if-no-files-found: error
          exclude: |
            backend/antenv/**
            backend/.venv/**
            backend/__pycache__/**
            backend/**/*.pyc

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A567F5DEA29F4C5480FFE01559FBDBC4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_14307D14834F4C779BACFE63CCA18262 }}
          allow-no-subscriptions: true

      - name: Configure Azure Web App Settings
        uses: azure/appservice-settings@v1
        with:
          app-name: 'tailorsync-api-prod'
          app-settings-json: |
            [
              { "name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "true", "slotSetting": false },
              { "name": "ENABLE_ORYX_BUILD", "value": "true", "slotSetting": false },
              { "name": "WEBSITES_PORT", "value": "8000", "slotSetting": false }
            ]
            
      - name: Wait for SCM container to restart
        run: sleep 30
            
      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'tailorsync-api-prod'
          slot-name: 'Production'
          package: .
          startup-command: 'uvicorn app.main:app --host 0.0.0.0 --port 8000'